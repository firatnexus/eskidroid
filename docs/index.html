<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EskiDroid — Eski Android uygulamaları arşivi</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#eee}
header{padding:16px;background:#1a1a1a;border-bottom:1px solid #333}
header h1{margin:0;font-size:1.3em}
input{width:100%;padding:12px;font-size:1em;border-radius:8px;border:1px solid #444;background:#222;color:#eee;box-sizing:border-box}
main{padding:16px;max-width:640px;margin:0 auto}
ul{list-style:none;padding:0}
li{padding:10px;border-bottom:1px solid #222}
li b{color:#6cf}
small{color:#888}
button{padding:8px 14px;border-radius:8px;border:0;background:#6c25af;color:#fff;font-size:.95em}
</style>
</head>
<body>
<header><h1>EskiDroid — eski Android sürümleri arşivi</h1><small>F-Droid arşivi, doğrudan tarayıcıdan APK indirme</small></header>
<main>
<input id="q" placeholder="Uygulama ara (ör. newpipe)" oninput="search()">
<ul id="res"></ul>
<p id="msg"></p>
</main>
<script>
let fd = null;
fetch('fdroid.json').then(r=>r.json()).then(d=>{fd=d;msg.textContent=fd.length+" uygulama yüklendi";});
function search(){
  const q = document.getElementById('q').value.toLowerCase();
  const res = document.getElementById('res');
  res.innerHTML='';
  if(!q||!fd) return;
  const hits = fd.filter(a=>a.name.toLowerCase().includes(q)||a.package.toLowerCase().includes(q)).slice(0,30);
  for(const a of hits){
    const li=document.createElement('li');
    const b=document.createElement('b');b.textContent=a.name;
    const s=document.createElement('small');s.textContent=' '+a.package+' — sürümler: '+a.versions.map(v=>v.version).join(', ');
    li.appendChild(b);li.appendChild(s);res.appendChild(li);
  }
}
</script>
</body>
</html>
