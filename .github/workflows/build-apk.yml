name: Build APK
on: [push, workflow_dispatch, workflow_call]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK (build-tools 34 + platform 34)
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          echo "y" | ./latest/bin/sdkmanager --sdk_root="$HOME/android-sdk" "build-tools;34.0.0" "platforms;android-34" > /dev/null
      - name: Build EskiDroid APK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          cd android-app
          chmod +x build.sh
          ./build.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskidroid-apk
          path: android-app/out/EskiDroid.apk
